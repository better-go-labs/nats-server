name: PGO nats-bench Throughput Evaluation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: nats-bench-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  nats-bench-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NATS CLI
        run: |
          go install github.com/nats-io/natscli/nats@latest
          nats --version
          nats bench --help 2>&1 | head -20 || true

      - name: Download PGO profile (latest captured artifact)
        run: |
          RUN_ID=$(gh api "/repos/${{ github.repository }}/actions/artifacts" \
            --paginate \
            --jq '[.artifacts[] | select(.name=="default-pgo" and .expired==false)] | sort_by(.created_at) | last | .workflow_run.id')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No unexpired default-pgo artifact found. Run profile-capture.yml first."
            exit 1
          fi
          echo "Downloading default-pgo from run $RUN_ID"
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name default-pgo --dir pgo-profile
          PGO_FILE=$(find pgo-profile -type f | head -1)
          if [ -z "$PGO_FILE" ]; then
            echo "::error::default-pgo artifact is empty"
            exit 1
          fi
          echo "PGO_FILE=$PGO_FILE" >> "$GITHUB_ENV"
          echo "Profile: $PGO_FILE ($(du -sh "$PGO_FILE" | cut -f1))"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build nats-server - baseline (no PGO)
        run: |
          go build -pgo=off -o nats-server-baseline .
          ls -lh nats-server-baseline
          ./nats-server-baseline --version

      - name: Build nats-server - PGO
        run: |
          go build -pgo="$PGO_FILE" -o nats-server-pgo .
          ls -lh nats-server-pgo
          ./nats-server-pgo --version

      - name: Run alternating nats-bench trials (N=5, 3 scenarios)
        run: |
          ulimit -n 65536
          mkdir -p results/baseline/s128b results/baseline/s512b results/baseline/s1kb
          mkdir -p results/pgo/s128b results/pgo/s512b results/pgo/s1kb

          # Scenarios: name:pub:sub:msgs:size
          # Memory per scenario: pubs x msgs x size (all well below 7GB runner limit)
          #   s128b: 2 pubs x 200K x 128B = ~51MB
          #   s512b: 4 pubs x 100K x 512B = ~205MB
          #   s1kb:  2 pubs x 50K  x 1KB  = ~102MB
          SCENARIOS="s128b:2:2:200000:128 s512b:4:4:100000:512 s1kb:2:2:50000:1024"
          TRIALS=5

          for trial in $(seq 1 $TRIALS); do
            echo "===== Trial $trial ====="
            for build in baseline pgo; do
              echo "--- build=$build ---"

              # Start server
              ./nats-server-${build} -p 4222 > server-${build}.log 2>&1 &
              SRV_PID=$!
              for i in $(seq 1 30); do
                nc -z localhost 4222 2>/dev/null && break
                sleep 0.3
              done
              if ! nc -z localhost 4222 2>/dev/null; then
                echo "::error::nats-server-${build} did not start"
                cat server-${build}.log
                kill "$SRV_PID" 2>/dev/null || true
                exit 1
              fi
              echo "nats-server-${build} started (pid=$SRV_PID)"

              for sc_def in $SCENARIOS; do
                IFS=: read -r sc pubs subs msgs size <<< "$sc_def"
                subject="pgo-bench-${sc}"
                echo "scenario $sc (pub=$pubs sub=$subs msgs=$msgs size=${size}B)"
                # Integrated form: nats bench handles pub+sub lifecycle and
                # tears down cleanly once all messages are delivered.
                # Both --pub and --sub goroutines exit after msgs are sent/received.
                timeout 120s nats bench "$subject" \
                  --pub "$pubs" --sub "$subs" \
                  --msgs "$msgs" --size "$size" \
                  2>&1 | tee "results/${build}/${sc}/trial${trial}.txt" || true
                sleep 1
              done

              # Stop server and wait for port to clear
              kill "$SRV_PID" 2>/dev/null || true
              for i in $(seq 1 15); do
                nc -z localhost 4222 2>/dev/null || break
                sleep 0.3
              done
              sleep 1
            done
          done

          echo "All trials complete."
          echo "--- Sample output: baseline s128b trial 1 ---"
          cat results/baseline/s128b/trial1.txt || echo "(empty)"

      - name: Compute statistics and generate report
        run: |
          python3 << 'PYEOF'
          import os, re, math, json

          def parse_throughput(text):
              # Matches: "Pub stats: 2,345,678 msgs/sec ~ 285.37 MB/sec"
              m = re.search(r'Pub stats[^:]*:\s+([\d,]+)\s+msgs/sec\s+~\s+([\d.]+)\s+MB/sec', text)
              if m:
                  return float(m.group(1).replace(',', '')), float(m.group(2))
              return None, None

          def mean_std(vals):
              n = len(vals)
              if not n:
                  return None, None, 0
              m = sum(vals) / n
              s = math.sqrt(sum((x - m) ** 2 for x in vals) / max(n - 1, 1))
              return m, s, n

          builds = ['baseline', 'pgo']
          scenarios = [('s128b', '128B/2-conn'), ('s512b', '512B/4-conn'), ('s1kb', '1KB/2-conn')]
          raw = {}

          for build in builds:
              raw[build] = {}
              for sc, _ in scenarios:
                  msgs_l, mb_l = [], []
                  d = f'results/{build}/{sc}'
                  if os.path.isdir(d):
                      for fn in sorted(os.listdir(d)):
                          if not fn.startswith('trial'):
                              continue
                          text = open(f'{d}/{fn}').read()
                          msgs, mb = parse_throughput(text)
                          if msgs is not None:
                              msgs_l.append(msgs)
                              mb_l.append(mb)
                  raw[build][sc] = {'msgs': msgs_l, 'mb': mb_l}

          with open('results/raw.json', 'w') as f:
              json.dump(raw, f, indent=2)

          L = [
              '## PGO nats-bench Throughput Evaluation',
              '',
              '_N=5 alternating trials (baseline, PGO, baseline, ...). Workload: nats bench integrated pub+sub._',
              '_Profile: 530KB CPU profile from 3200s nats-bench pub+sub load (run #69)._',
              '_Runner: ubuntu-latest (~7GB RAM, AMD EPYC 7763). Verdict threshold: +/-3% geomean._',
              '',
              '### Throughput - msgs/sec',
              '',
              '| Scenario | Baseline (mean+/-sd) | PGO (mean+/-sd) | N (base/pgo) | Delta% |',
              '|---|---|---|---|---|',
          ]

          ratios = []
          for sc, label in scenarios:
              bm, bs, bn = mean_std(raw['baseline'][sc]['msgs'])
              pm, ps, pn = mean_std(raw['pgo'][sc]['msgs'])
              if bm and pm:
                  d = (pm - bm) / bm * 100
                  ratios.append(pm / bm)
                  L.append(f'| {label} | {bm/1e6:.3f}M +/- {bs/1e6:.3f}M | {pm/1e6:.3f}M +/- {ps/1e6:.3f}M | {bn}/{pn} | {d:+.1f}% |')
              else:
                  L.append(f'| {label} | -- | -- | {bn}/{pn} | -- |')

          L += [
              '',
              '### Throughput - MB/s',
              '',
              '| Scenario | Baseline (mean+/-sd) | PGO (mean+/-sd) | Delta% |',
              '|---|---|---|---|',
          ]
          for sc, label in scenarios:
              bm, bs, _ = mean_std(raw['baseline'][sc]['mb'])
              pm, ps, _ = mean_std(raw['pgo'][sc]['mb'])
              if bm and pm:
                  d = (pm - bm) / bm * 100
                  L.append(f'| {label} | {bm:.1f} +/- {bs:.1f} | {pm:.1f} +/- {ps:.1f} | {d:+.1f}% |')
              else:
                  L.append(f'| {label} | -- | -- | -- |')

          L.append('')
          L.append('### Verdict')
          L.append('')

          if ratios:
              gm = (math.exp(sum(math.log(r) for r in ratios) / len(ratios)) - 1) * 100
              L.append(f'**Geomean throughput delta (PGO vs baseline): {gm:+.1f}%**')
              L.append('')
              if gm > 3.0:
                  L.append(f'**YES** -- PGO improves real-workload throughput by {gm:+.1f}% geomean (3 scenarios x N=5 trials).')
              elif gm < -3.0:
                  L.append(f'**NO** -- PGO degrades real-workload throughput by {gm:+.1f}% geomean (3 scenarios x N=5 trials).')
              else:
                  L.append(
                      f'**INCONCLUSIVE** -- PGO throughput effect is {gm:+.1f}%, within the +/-3% noise '
                      'threshold typical for macro benchmarks. '
                      'Microbenchmark baseline showed +0.95% geomean slowdown (sec/op) on single-op synthetic '
                      'workloads that do not reflect the mixed-load behavior the profile was captured from. '
                      'More trials or a longer warm-up window would sharpen the signal.'
                  )
          else:
              L.append(
                  '**INCONCLUSIVE** -- Could not parse nats-bench output. '
                  'Check the nats-bench-results artifact for raw trial files and server logs.'
              )

          L += [
              '',
              '---',
              '_Microbenchmark reference (benchstat n=10): +0.95% geomean sec/op regression on single-op synthetic workload._',
              '_This workflow tests the profile intended target: sustained pub+sub throughput under production-shaped load._',
          ]

          report = '\n'.join(L)
          with open('nats-bench-report.md', 'w') as f:
              f.write(report)
          print(report)
          PYEOF

      - name: Post sticky PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pgo-nats-bench
          path: nats-bench-report.md

      - name: Append to job summary
        run: cat nats-bench-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload nats-bench results
        uses: actions/upload-artifact@v4
        with:
          name: nats-bench-results
          path: |
            results/
            nats-bench-report.md
          if-no-files-found: warn
